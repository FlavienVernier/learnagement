# Purpose: assemble the Learnagement namespace, workloads, configuration, and network policies into one Kustomize base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: learnagement
resources:
  - namespace.yaml
  - configmap.yaml
  - mysql.yaml
  - backend.yaml
  - interfaces.yaml
  - networkpolicy.yaml
