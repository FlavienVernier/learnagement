<VirtualHost *:443>
    ServerName localhost

    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile      /etc/ssl/learnagement-external/cert.pem
    SSLCertificateKeyFile   /etc/ssl/learnagement-external/key.pem

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>